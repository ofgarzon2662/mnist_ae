name: Test & Coverage

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: contains(github.event.head_commit.message, 'RELEASE')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install full requirements except pywin32
        run: |
          grep -v "^pywin32" requirements.txt > req.txt
          python -m pip install --upgrade pip
          pip install -r req.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests with coverage (fail under 75%)
        run: |
          pytest --cov=mnist_ae --cov-report=term --cov-report=xml --cov-fail-under=75

      - name: Create release branch from commit message
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          NAME=$(echo "${{ github.event.head_commit.message }}" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-80)
          git checkout -b "$NAME"
          git push origin "$NAME"

      - name: Success message
        if: success()
        run: echo "Coverage ≥ 75 %. Branch '$NAME' created from passing commit."
